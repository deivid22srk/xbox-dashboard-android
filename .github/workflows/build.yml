name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    name: Exportar APK (Godot ${{ env.GODOT_VERSION }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-godot441-${{ runner.os }}-v2
          restore-keys: gradle-godot441-${{ runner.os }}-

      - name: Instalar Godot 4.4.1 + export templates
        run: |
          set -e
          cd /tmp
          curl -sL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
          curl -sL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -o -q templates.tpz -d /tmp/tpl_out
          mv /tmp/tpl_out/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | head -5

      - name: Preparar template gradle + patches (manifest/provider/file_paths)
        run: python3 tools/setup_android_template.py

      - name: Gerar keystore de debug
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar editor settings (SDK/keystore)
        run: |
          mkdir -p ~/.config/godot
          JAVA_RESOLVED="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which javac))))}"
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          config_version=5

          [export]

          android/android_sdk_path="${ANDROID_HOME}"
          android/java_sdk_path="${JAVA_RESOLVED}"
          android/debug_keystore="$HOME/.android/debug.keystore"
          android/debug_keystore_user="androiddebugkey"
          android/debug_keystore_pass="android"
          EOF
          cat ~/.config/godot/editor_settings-4.tres

      - name: Importar recursos
        run: godot --headless --import . 2>&1 | tail -20

      - name: Exportar APK (debug-assinado via gradle)
        run: |
          set -e
          godot --headless --export-debug "Android" build/SeriesDash.apk 2>&1 | tee export_log.txt | tail -40
          test -f build/SeriesDash.apk || { echo "::error::APK nao foi gerado"; grep -i -A5 "error\|ERRO" export_log.txt | head -60; exit 1; }

      - name: Verificar APK
        run: |
          ls -lh build/SeriesDash.apk
          BT=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs build/SeriesDash.apk || echo "::warning::apksigner verify falhou"
          "$BT/aapt" dump badging build/SeriesDash.apk | head -6 || true

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeriesDash-apk
          path: build/SeriesDash.apk
          if-no-files-found: error
